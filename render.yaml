# Render Blueprint: one free web service that serves the API and the built Angular app.
services:
  - type: web
    name: jobready
    runtime: node
    plan: free
    region: singapore
    buildCommand: cd client && npm ci --include=dev && npm run build && cd ../server && npm ci --include=dev && npm run build
    startCommand: cd server && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
